name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 3 * * *"   # nightly: live browser tests against the current Camoufox
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint & types
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy

  unit:
    name: Unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Offline tests (no browser)
        run: pytest tests/ -v -m "not live_browser and not ui"

  ui:
    name: UI end-to-end
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - id: camoufox
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("camoufox"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/camoufox
          key: camoufox-${{ runner.os }}-${{ steps.camoufox.outputs.version }}
      - name: Fetch the Camoufox browser
        run: python -m camoufox fetch
      - name: Frontend flows against the mock bridge
        run: pytest tests/ -v -m ui

  live:
    name: Live browser tests
    # Real Camoufox launches (parity, canvas policy, anonymity probe): on main, nightly and on demand.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - id: camoufox
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("camoufox"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/camoufox
          key: camoufox-${{ runner.os }}-${{ steps.camoufox.outputs.version }}
      - name: Fetch the Camoufox browser
        run: python -m camoufox fetch
      - name: Live tests
        run: pytest tests/ -v -m live_browser

  build:
    name: Build CamouDesk.app
    needs: [lint, unit]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/cache
          key: bundle-cache-${{ runner.os }}-${{ hashFiles('macos/requirements.lock', 'macos/build_app.sh') }}
          restore-keys: bundle-cache-${{ runner.os }}-
      - name: Build self-contained bundle
        run: bash macos/build_app.sh --no-install
      - name: Zip the bundle (ditto keeps mtimes and signatures)
        run: ditto -c -k --keepParent dist/CamouDesk.app dist/CamouDesk-${{ github.sha }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CamouDesk-app
          path: dist/CamouDesk-${{ github.sha }}.zip
          retention-days: 14

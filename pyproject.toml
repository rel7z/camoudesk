[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "camoudesk"
version = "0.2.1"
description = "Open-source macOS anti-detect profile manager powered by Camoufox & PyWebView"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "CamouDesk Contributors"}
]
keywords = ["camoufox", "antidetect", "privacy", "browser", "macos", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X :: Cocoa",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "camoufox[geoip]>=0.5.9",
    "playwright>=1.62.0",
    "pywebview>=6.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.scripts]
camoudesk = "camoudesk.cli:main"
camoudesk-gui = "camoudesk.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"camoudesk.ui" = ["frontend/*", "frontend/*/*"]
"camoudesk.core" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live_browser: integration tests that launch a real Camoufox browser binary",
    "ui: end-to-end UI tests (Camoufox drives the frontend against the mock bridge)",
]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["build", "dist", "src/camoudesk/ui/frontend"]

[tool.ruff.lint]
# Errors, pyflakes, import sorting, bugbear, pyupgrade-lite. Style is not enforced beyond that.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long lines: wrapped where it reads better, not by rule
    "E731",   # small lambdas in route tables
    "B008",   # dataclass field(default_factory=...) style calls
    "UP006", "UP007", "UP035", "UP045",  # typing.Dict/Optional kept for readability and 3.11 compatibility
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["camoudesk"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["camoudesk"]
ignore_missing_imports = true
warn_unused_ignores = false
# Gradual: strict where the architecture lives, lenient for the older modules.
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["camoudesk.services.*", "camoudesk.engines.*", "camoudesk.models.*", "camoudesk.core.events", "camoudesk.core.providers.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

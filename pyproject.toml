[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "camoudesk"
version = "0.1.0"
description = "Open-source macOS anti-detect profile manager powered by Camoufox & PyWebView"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "CamouDesk Contributors"}
]
keywords = ["camoufox", "antidetect", "privacy", "browser", "macos", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X :: Cocoa",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "camoufox[geoip]>=0.5.9",
    "playwright>=1.62.0",
    "pywebview>=6.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[project.scripts]
camoudesk = "camoudesk.cli:main"
camoudesk-gui = "camoudesk.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"camoudesk.ui" = ["frontend/*", "frontend/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live_browser: integration tests that launch a real Camoufox browser binary",
]
